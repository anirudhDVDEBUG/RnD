project: "Enterprise E-Commerce Platform"
description: "Next-generation e-commerce platform with AI-powered recommendations, multi-tenant support, and global payment processing."

stakeholders:
  - name: "Product Owner"
    requirements:
      - text: "Users must be able to search products by keyword, category, and filters"
        domain: functional
        priority: critical
      - text: "Checkout must support Stripe, PayPal, and Apple Pay"
        domain: functional
        priority: critical
      - text: "Product recommendations powered by user behavior and purchase history"
        domain: functional
        priority: high
      - text: "Admin dashboard for inventory management and order tracking"
        domain: functional
        priority: high

  - name: "CTO"
    requirements:
      - text: "System must handle 10,000 concurrent users with sub-200ms response times"
        domain: non-functional
        priority: critical
      - text: "All data must be encrypted at rest and in transit using AES-256 and TLS 1.3"
        domain: non-functional
        priority: critical
      - text: "Microservices architecture with independent deployment per service"
        domain: technical
        priority: high
      - text: "CI/CD pipeline with automated testing and staged rollouts"
        domain: technical
        priority: medium

  - name: "Head of Marketing"
    requirements:
      - text: "A/B testing framework for product pages and checkout flows"
        domain: functional
        priority: medium
      - text: "SEO-optimized product pages with structured data markup"
        domain: functional
        priority: high
      - text: "Email notification system for abandoned carts and promotions"
        domain: functional
        priority: medium
      - text: "Analytics dashboard showing conversion funnels and revenue metrics"
        domain: functional
        priority: high
