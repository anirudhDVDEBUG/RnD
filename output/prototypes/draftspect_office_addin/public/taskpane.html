<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draftspect — Claude Code in Office</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #2b5797, #1e3a5f);
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header .badge {
      font-size: 10px;
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .tabs {
      display: flex;
      background: #e8e8e8;
      border-bottom: 1px solid #ccc;
    }
    .tab {
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: #666;
    }
    .tab.active {
      color: #2b5797;
      border-bottom-color: #2b5797;
      background: #f5f5f5;
    }

    .doc-preview {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 10px 14px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.5;
      color: #444;
    }
    .doc-preview .label {
      font-size: 10px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .doc-preview pre {
      white-space: pre-wrap;
      font-family: inherit;
    }
    .doc-preview table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      margin-top: 4px;
    }
    .doc-preview th, .doc-preview td {
      border: 1px solid #ddd;
      padding: 3px 6px;
      text-align: left;
    }
    .doc-preview th { background: #f0f0f0; font-weight: 600; }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 92%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .message.user {
      align-self: flex-end;
      background: #2b5797;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
      border-bottom-left-radius: 4px;
    }
    .message.assistant :is(strong, b) { color: #2b5797; }
    .message.system {
      align-self: center;
      background: #fff3cd;
      border: 1px solid #ffc107;
      font-size: 11px;
      color: #856404;
      text-align: center;
    }

    .input-area {
      border-top: 1px solid #ddd;
      padding: 10px 12px;
      background: white;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
    }
    .input-area input:focus { border-color: #2b5797; }
    .input-area button {
      background: #2b5797;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 13px;
      cursor: pointer;
    }
    .input-area button:hover { background: #1e3a5f; }
    .input-area button:disabled { background: #999; cursor: not-allowed; }

    .context-bar {
      background: #eef2f7;
      padding: 6px 14px;
      font-size: 10px;
      color: #555;
      border-top: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .context-bar .dot { width: 6px; height: 6px; background: #4caf50; border-radius: 50%; }

    .typing { opacity: 0.6; font-style: italic; }
  </style>
</head>
<body>

<div class="header">
  <h1>Draftspect</h1>
  <span class="badge">Claude Code</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="word" onclick="switchTab('word')">Word Doc</div>
  <div class="tab" data-tab="excel" onclick="switchTab('excel')">Excel Sheet</div>
</div>

<div class="doc-preview" id="doc-preview"></div>

<div class="chat-area" id="chat-area">
  <div class="message system">
    Connected to Claude Code (demo mode). Your document and spreadsheet are loaded as context.
  </div>
</div>

<div class="input-area">
  <input type="text" id="msg-input" placeholder="Ask Claude about your document..."
    onkeydown="if(event.key==='Enter')sendMessage()" />
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<div class="context-bar">
  <span class="dot"></span>
  <span>Local mode — all data stays on your machine</span>
</div>

<script>
  let currentTab = "word";

  async function loadDocPreview() {
    const preview = document.getElementById("doc-preview");
    if (currentTab === "word") {
      const res = await fetch("/api/word/text");
      const { text } = await res.json();
      const lines = text.split("\n").slice(0, 12).join("\n");
      preview.innerHTML = `<div class="label">Active Document (Word)</div><pre>${escapeHtml(lines)}...</pre>`;
    } else {
      const res = await fetch("/api/excel/data/Revenue");
      const { data } = await res.json();
      let html = '<div class="label">Active Sheet (Excel — Revenue)</div><table>';
      data.forEach((row, i) => {
        html += "<tr>" + row.map(c => i === 0 ? `<th>${escapeHtml(String(c))}</th>` : `<td>${formatCell(c)}</td>`).join("") + "</tr>";
      });
      html += "</table>";
      preview.innerHTML = html;
    }
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    loadDocPreview();
  }

  async function sendMessage() {
    const input = document.getElementById("msg-input");
    const btn = document.getElementById("send-btn");
    const msg = input.value.trim();
    if (!msg) return;

    addMessage("user", msg);
    input.value = "";
    btn.disabled = true;

    const typing = addMessage("assistant", "Thinking...", "typing");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg }),
      });
      const data = await res.json();
      typing.remove();
      addMessage("assistant", formatMarkdown(data.reply));

      if (data.action) {
        addMessage("system", `Proposed action: ${data.action.type} — confirm in the real add-in`);
      }
    } catch (err) {
      typing.remove();
      addMessage("system", "Error: " + err.message);
    }

    btn.disabled = false;
    input.focus();
  }

  function addMessage(role, content, cls) {
    const area = document.getElementById("chat-area");
    const div = document.createElement("div");
    div.className = `message ${role}` + (cls ? ` ${cls}` : "");
    div.innerHTML = content;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    return div;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function formatCell(v) {
    if (typeof v === "number") {
      return v >= 1000 ? v.toLocaleString() : (v < 1 ? (v * 100).toFixed(1) + "%" : v);
    }
    return escapeHtml(String(v));
  }

  function formatMarkdown(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n\n/g, "<br><br>")
      .replace(/\n\|(.+)\|/g, (m) => m)  // keep tables as-is for now
      .replace(/\n- /g, "<br>• ")
      .replace(/\n/g, "<br>")
      .replace(/&gt; (.+?)(<br>|$)/g, "<blockquote style='border-left:3px solid #2b5797;padding-left:8px;margin:6px 0;color:#555'>$1</blockquote>");
  }

  // Load on start
  loadDocPreview();
</script>
</body>
</html>
